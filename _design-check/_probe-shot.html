<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>shot</title>
<style>
  html,body{margin:0;padding:0;background:#9aa0a6}
  .wrap{padding:20px;width:390px}
  iframe{border:0;display:block;background:#fff}
  pre{font:11px monospace;color:#fff;padding:6px 20px}
</style></head>
<body>
<div class="wrap"><iframe id="f" scrolling="no"></iframe></div>
<pre id="probe-h">PENDING</pre>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var page   = qs.get('p') || '/index.html';
  var W      = parseInt(qs.get('w') || '390', 10);
  var clicks = parseInt(qs.get('clicks') || '0', 10);
  var state  = qs.get('state');           // optional: menu | faq | option1 ...
  var inject = qs.get('css');             // optional: raw CSS re-injected after load
  var delay  = parseInt(qs.get('delay') || '700', 10);
  var f = document.getElementById('f'), out = document.getElementById('probe-h');
  f.style.width = W + 'px';
  f.src = page;

  function injectCSS(d) {
    if (!inject) return;
    var s = d.createElement('style');
    s.setAttribute('data-probe-inject', '1');
    s.textContent = inject;
    d.head.appendChild(s);
  }

  function report(tag) {
    var d = f.contentDocument;
    var h = d ? Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) : 0;
    f.style.height = h + 'px';
    out.textContent = 'PROBE_H:' + h + ':W:' + W + ':' + tag + ':END_H';
  }

  f.onload = function () {
    var d = f.contentDocument;
    if (!d) { out.textContent = 'PROBE_H:0:END_H'; return; }
    injectCSS(d);
    if (state === 'menu') {
      var t = d.querySelector('.nav-toggle'); if (t) t.click();
    }
    if (state === 'menu-practices') {
      var t2 = d.querySelector('.nav-toggle'); if (t2) t2.click();
      var b = d.querySelector('.nav-item.has-dropdown > .nav-link'); if (b) b.click();
    }
    if (state && state.indexOf('faq') === 0) {
      var n = parseInt(state.replace('faq', '') || '0', 10);
      var s = d.querySelectorAll('.faq-item summary'); if (s[n]) s[n].click();
    }
    var i = 0;
    function step() {
      if (i >= clicks) { setTimeout(function () { report(state || 'plain'); }, 500); return; }
      var opt = d.querySelector('.quiz-step.active .quiz-option');
      if (opt) opt.click();
      i++;
      setTimeout(step, delay);
    }
    setTimeout(step, 500);
  };
})();
</script>
</body>
</html>
